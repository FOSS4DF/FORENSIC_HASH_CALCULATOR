<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<link rel="icon" type="image/x-icon" href="https://www.peacekeeping.ch/setup/favicons/favicon-32x32.png">
<title>Forensic Hash Calculator</title>
<style>
:root{
  --bg:#F2F4F5; --surface:#FFFFFF; --ink:#12171A; --muted:#69747C;
  --rule:#DDE2E5; --rule-strong:#C2CACF; --accent:#125A63; --accent-ink:#FFFFFF;
  --warn:#9A5B00; --warn-bg:#FBF0DE; --danger:#8E2C21;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
html[data-theme="dark"]{
  --bg:#0E1113; --surface:#171B1E; --ink:#E7EAEC; --muted:#8B959C;
  --rule:#262B2F; --rule-strong:#394247; --accent:#4FA8A4; --accent-ink:#06181A;
  --warn:#E0AC63; --warn-bg:#2A2015; --danger:#E0847A;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); font-family:var(--ui);
  font-size:15px; line-height:1.45; -webkit-text-size-adjust:100%;
  padding-bottom:calc(84px + env(safe-area-inset-bottom));
}
.wrap{max-width:760px;margin:0 auto;padding:0 20px}
[hidden]{display:none!important}

/* ---------- header ---------- */
header{border-bottom:1px solid var(--rule);background:var(--surface)}
.hbar{display:flex;align-items:center;gap:12px;padding:14px 0}
.mark{width:26px;height:26px;flex:none;display:block}
.mark svg{width:26px;height:26px;display:block;stroke:var(--ink);fill:none;stroke-width:1.5;stroke-linecap:square;stroke-linejoin:miter}
h1{font-size:15px;font-weight:650;letter-spacing:-.01em;margin:0;flex:1;min-width:0}
h1 small{display:block;font-weight:400;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-top:1px}
.ctrl{display:flex;gap:8px;align-items:center}
select,input,button{font-family:inherit;font-size:14px;color:var(--ink)}
select.lang{appearance:none;-webkit-appearance:none;background:transparent;border:1px solid var(--rule-strong);
  border-radius:3px;padding:6px 8px;font-size:12px;letter-spacing:.06em;font-weight:600}
.icon-btn{background:transparent;border:1px solid var(--rule-strong);border-radius:3px;width:32px;height:31px;
  display:grid;place-items:center;cursor:pointer;padding:0}
.icon-btn:hover{border-color:var(--ink)}
.icon-btn svg{width:15px;height:15px;stroke:var(--ink);fill:none;stroke-width:1.6}

/* ---------- sections & fields ---------- */
section{margin-top:22px}
.eyebrow{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:9px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:520px){.fields{grid-template-columns:1fr}}
.field label{display:block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:5px}
.field input,.field select{width:100%;background:var(--surface);border:1px solid var(--rule-strong);border-radius:3px;
  padding:10px 11px;font-size:15px;font-family:var(--mono)}
.field select{appearance:none;-webkit-appearance:none;font-family:var(--ui);font-size:14px;cursor:pointer}
.field input:focus,.field select:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}

/* ---------- add ---------- */
.add{margin-top:0;width:100%;display:flex;align-items:center;justify-content:center;gap:9px;
  background:var(--surface);border:1px dashed var(--rule-strong);border-radius:3px;padding:18px;
  cursor:pointer;font-size:15px;font-weight:600;color:var(--ink)}
.add:hover,.add.drag{border-color:var(--accent);color:var(--accent)}
.add:disabled{opacity:.4;cursor:default;border-color:var(--rule-strong);color:var(--ink)}
.add svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.7}
.hint{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.5}

/* ---------- list ---------- */
.count{display:flex;align-items:baseline;justify-content:space-between;gap:10px;border-bottom:1px solid var(--rule);padding-bottom:7px;margin-bottom:2px}
.count b{font-family:var(--mono);font-size:12px;font-weight:600}
.linkbtn{background:none;border:none;padding:0;color:var(--muted);font-size:12px;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.linkbtn:hover{color:var(--danger)}
.empty{border:1px solid var(--rule);border-radius:3px;background:var(--surface);padding:26px 18px;text-align:center;color:var(--muted);font-size:13px}
.row{display:grid;grid-template-columns:22px 1fr auto;gap:12px;padding:12px 0;border-bottom:1px solid var(--rule);align-items:center}
.idx{font-family:var(--mono);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.fname{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fsize{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:1px}
.rm{background:none;border:none;padding:0;color:var(--muted);font-size:11px;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.rm:hover{color:var(--danger)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:11px;margin:0}
.kv dt{color:var(--muted);letter-spacing:.06em;text-transform:uppercase;font-size:9.5px;font-weight:600;padding-top:1.5px}
.kv dd{margin:0;font-family:var(--mono);font-size:11px;word-break:break-all;line-height:1.4}
.miss{color:var(--warn);background:var(--warn-bg);padding:0 4px;border-radius:2px;font-family:var(--ui);font-size:10px;letter-spacing:.04em}

/* ---------- panels & buttons ---------- */
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:3px;padding:16px 18px}
.ptitle{font-size:15px;font-weight:650;margin:0 0 4px}
.pdesc{font-size:13px;color:var(--muted);margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;align-items:center}
.chip{font-family:var(--mono);font-size:11px;border:1px solid var(--rule-strong);border-radius:2px;padding:2px 6px}
.ghost{display:inline-flex;align-items:center;gap:6px;background:none;border:1px solid var(--rule-strong);
  border-radius:3px;padding:6px 10px;font-size:11px;letter-spacing:.05em;text-transform:uppercase;
  font-weight:600;color:var(--muted);cursor:pointer;text-decoration:none}
.ghost:hover{color:var(--ink);border-color:var(--ink)}
.ghost:disabled{opacity:.3;cursor:default}
.ghost svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:1.8}
.err{border:1px solid var(--danger);color:var(--danger);border-radius:3px;padding:10px 12px;font-size:13px;margin-top:12px;background:var(--surface)}

/* ---------- bar ---------- */
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--rule);
  padding:12px 20px calc(12px + env(safe-area-inset-bottom));z-index:5}
.prog{position:absolute;left:0;top:-1px;height:2px;width:0;background:var(--accent);transition:width .3s ease}
.bar-in{max-width:760px;margin:0 auto;display:flex;gap:12px;align-items:center}
.status{flex:1;font-size:11.5px;color:var(--muted);font-family:var(--mono);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.go{background:var(--accent);color:var(--accent-ink);border:none;border-radius:3px;padding:13px 22px;
  font-size:15px;font-weight:650;cursor:pointer;letter-spacing:.01em;white-space:nowrap}
.go:disabled{opacity:.4;cursor:default}
.go:focus-visible,.add:focus-visible,.icon-btn:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
footer{margin:26px 0 6px;font-size:11px;color:var(--muted);text-align:center;line-height:1.6}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

.adds{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:520px){.adds{grid-template-columns:1fr}}
.item{display:grid;grid-template-columns:22px 1fr;gap:4px 12px;padding:13px 0;border-bottom:1px solid var(--rule);align-items:start}
.item .idx{padding-top:2px}
.item .fname{white-space:normal;word-break:break-all;overflow:visible}
.item .fsize{margin-bottom:6px}
.item .kv{grid-column:2}
.item .kv dd.h{font-size:10.5px;user-select:all}
.item .actions{grid-column:2;display:flex;gap:12px;margin-top:6px;align-items:center}
.ibar{grid-column:2;height:2px;background:var(--rule);margin-top:4px}
.ibar i{display:block;height:2px;width:0;background:var(--accent)}
.state{font-family:var(--mono);font-size:11px;color:var(--muted)}
.dup{color:var(--warn);background:var(--warn-bg);padding:0 4px;border-radius:2px;font-family:var(--ui);font-size:10px;letter-spacing:.04em}
.bad{color:var(--danger);font-family:var(--ui);font-size:11px;font-weight:600}
</style>
</head>
<body>

<header>
  <div class="wrap hbar">
    <div class="mark" aria-hidden="true"><svg viewBox="0 0 26 26"><rect x=".75" y=".75" width="24.5" height="24.5"/><path d="M11 6.5 9.2 19.5M16.8 6.5 15 19.5M6.5 10.5h13.5M6 15.5h13.5"/></svg></div>
    <h1><span id="t-app">Forensic Hash Calculator</span><small id="t-sub">Hors ligne · MD5 · SHA-1 · SHA-256 · SHA-512</small></h1>
    <div class="ctrl">
      <select class="lang" id="lang" aria-label="Langue">
        <option value="fr">FR</option><option value="en">EN</option>
        <option value="sw">SW</option><option value="ln">LN</option>
      </select>
      <button class="icon-btn" id="theme" type="button" aria-label="Theme">
        <svg id="ticon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>
      </button>
    </div>
  </div>
</header>

<main class="wrap">
  <section>
    <div class="eyebrow" id="t-caseinfo"></div>
    <div class="fields">
      <div class="field"><label for="examiner" id="t-examiner"></label><input id="examiner" autocomplete="off" spellcheck="false"></div>
      <div class="field"><label for="caseno" id="t-caseno"></label><input id="caseno" autocomplete="off" spellcheck="false"></div>
    </div>
  </section>

  <section>
    <div class="eyebrow" id="t-files"></div>
    <div class="adds">
      <button class="add" id="addFiles" type="button">
        <svg viewBox="0 0 24 24"><path d="M6 2.5h8l4 4v15H6z"/><path d="M14 2.5v4h4"/><path d="M12 10v7M8.5 13.5h7"/></svg>
        <span id="t-addFiles"></span>
      </button>
      <button class="add" id="addFolder" type="button">
        <svg viewBox="0 0 24 24"><path d="M2.5 5.5h7l2 2.5h10v11.5h-19z"/><path d="M12 11v6M9 14h6"/></svg>
        <span id="t-addFolder"></span>
      </button>
    </div>
    <input type="file" id="fileIn" multiple class="sr">
    <input type="file" id="dirIn" webkitdirectory directory multiple class="sr">
    <p class="hint" id="t-hint"></p>
  </section>

  <section>
    <div class="count"><b id="cnt">00</b><button class="linkbtn" id="clear" type="button" hidden></button></div>
    <div id="list"></div>
    <div class="empty" id="empty"></div>
  </section>

  <footer id="t-foot"></footer>
</main>

<div class="bar">
  <div class="prog" id="prog"></div>
  <div class="bar-in">
    <div class="status" id="status" aria-live="polite"></div>
    <button class="ghost" id="csv" type="button" disabled>CSV</button>
    <button class="go" id="go" type="button" disabled></button>
  </div>
</div>

<script>
"use strict";
var PREFIX="fhc";
/* ============================================================
   Incremental MD5 / SHA-1 / SHA-256 / SHA-512 (pure JS, offline)
   Each object: update(Uint8Array) … digest() -> hex string
   ============================================================ */
function hex32be(w){ return (w>>>0).toString(16).padStart(8,"0"); }
function hex32le(w){ return [w&255,(w>>>8)&255,(w>>>16)&255,(w>>>24)&255].map(function(b){return b.toString(16).padStart(2,"0");}).join(""); }

function Hasher(blockSize, compress, finish){
  this.bs=blockSize; this.buf=new Uint8Array(blockSize); this.bl=0; this.len=0;
  this.compress=compress; this.finish=finish;
}
Hasher.prototype.update=function(data){
  var i=0, n=data.length; this.len+=n;
  if(this.bl){
    var take=Math.min(this.bs-this.bl, n);
    this.buf.set(data.subarray(0,take), this.bl); this.bl+=take; i=take;
    if(this.bl===this.bs){ this.compress(this.buf,0); this.bl=0; }
  }
  for(; i+this.bs<=n; i+=this.bs) this.compress(data,i);
  if(i<n){ this.buf.set(data.subarray(i),0); this.bl=n-i; }
  return this;
};
Hasher.prototype.pad=function(littleEndian){
  var bs=this.bs, lenField=bs===128?16:8, len=this.len;
  var padLen=(this.bl<bs-lenField)?(bs-this.bl):(2*bs-this.bl);
  var p=new Uint8Array(padLen); p[0]=0x80;
  var lo=(len*8)%4294967296, hi=Math.floor(len/536870912);
  var dv=new DataView(p.buffer);
  if(littleEndian){ dv.setUint32(padLen-8,lo,true); dv.setUint32(padLen-4,hi,true); }
  else { dv.setUint32(padLen-8,hi); dv.setUint32(padLen-4,lo); }
  var saveLen=this.len; this.update(p); this.len=saveLen;
};

/* ---------- MD5 ---------- */
var MD5_K=new Int32Array(64), MD5_S=[7,12,17,22,7,12,17,22,7,12,17,22,7,12,17,22,5,9,14,20,5,9,14,20,5,9,14,20,5,9,14,20,4,11,16,23,4,11,16,23,4,11,16,23,4,11,16,23,6,10,15,21,6,10,15,21,6,10,15,21,6,10,15,21];
for(var _i=0;_i<64;_i++) MD5_K[_i]=Math.floor(Math.abs(Math.sin(_i+1))*4294967296)|0;
function MD5(){
  var H=[0x67452301,0xefcdab89|0,0x98badcfe|0,0x10325476], X=new Int32Array(16);
  var h=new Hasher(64,function(d,o){
    for(var j=0;j<16;j++){ var q=o+j*4; X[j]=d[q]|(d[q+1]<<8)|(d[q+2]<<16)|(d[q+3]<<24); }
    var a=H[0],b=H[1],c=H[2],e=H[3];
    for(var i=0;i<64;i++){
      var f,g;
      if(i<16){ f=(b&c)|(~b&e); g=i; }
      else if(i<32){ f=(e&b)|(~e&c); g=(5*i+1)&15; }
      else if(i<48){ f=b^c^e; g=(3*i+5)&15; }
      else { f=c^(b|~e); g=(7*i)&15; }
      var tmp=e; e=c; c=b;
      var x=(a+f+MD5_K[i]+X[g])|0, s=MD5_S[i];
      b=(b+((x<<s)|(x>>>(32-s))))|0; a=tmp;
    }
    H[0]=(H[0]+a)|0; H[1]=(H[1]+b)|0; H[2]=(H[2]+c)|0; H[3]=(H[3]+e)|0;
  });
  h.digest=function(){ this.pad(true); return H.map(hex32le).join(""); };
  return h;
}

/* ---------- SHA-1 ---------- */
function SHA1(){
  var H=[0x67452301,0xEFCDAB89|0,0x98BADCFE|0,0x10325476,0xC3D2E1F0|0], W=new Int32Array(80);
  var h=new Hasher(64,function(d,o){
    for(var j=0;j<16;j++){ var q=o+j*4; W[j]=(d[q]<<24)|(d[q+1]<<16)|(d[q+2]<<8)|d[q+3]; }
    for(j=16;j<80;j++){ var x=W[j-3]^W[j-8]^W[j-14]^W[j-16]; W[j]=(x<<1)|(x>>>31); }
    var a=H[0],b=H[1],c=H[2],e=H[3],f=H[4];
    for(j=0;j<80;j++){
      var k,fn;
      if(j<20){ fn=(b&c)|(~b&e); k=0x5A827999; }
      else if(j<40){ fn=b^c^e; k=0x6ED9EBA1; }
      else if(j<60){ fn=(b&c)|(b&e)|(c&e); k=0x8F1BBCDC|0; }
      else { fn=b^c^e; k=0xCA62C1D6|0; }
      var t=(((a<<5)|(a>>>27))+fn+f+k+W[j])|0;
      f=e; e=c; c=(b<<30)|(b>>>2); b=a; a=t;
    }
    H[0]=(H[0]+a)|0; H[1]=(H[1]+b)|0; H[2]=(H[2]+c)|0; H[3]=(H[3]+e)|0; H[4]=(H[4]+f)|0;
  });
  h.digest=function(){ this.pad(false); return H.map(hex32be).join(""); };
  return h;
}

/* ---------- SHA-256 ---------- */
var K256=new Int32Array([0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2]);
function SHA256(){
  var H=new Int32Array([0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19]), W=new Int32Array(64);
  var h=new Hasher(64,function(d,o){
    for(var j=0;j<16;j++){ var q=o+j*4; W[j]=(d[q]<<24)|(d[q+1]<<16)|(d[q+2]<<8)|d[q+3]; }
    for(j=16;j<64;j++){
      var a1=W[j-15], a2=W[j-2];
      var s0=((a1>>>7)|(a1<<25))^((a1>>>18)|(a1<<14))^(a1>>>3);
      var s1=((a2>>>17)|(a2<<15))^((a2>>>19)|(a2<<13))^(a2>>>10);
      W[j]=(W[j-16]+s0+W[j-7]+s1)|0;
    }
    var a=H[0],b=H[1],c=H[2],e=H[3],f=H[4],g=H[5],hh=H[6],k=H[7];
    for(j=0;j<64;j++){
      var S1=((f>>>6)|(f<<26))^((f>>>11)|(f<<21))^((f>>>25)|(f<<7));
      var ch=(f&g)^(~f&hh);
      var t1=(k+S1+ch+K256[j]+W[j])|0;
      var S0=((a>>>2)|(a<<30))^((a>>>13)|(a<<19))^((a>>>22)|(a<<10));
      var mj=(a&b)^(a&c)^(b&c);
      var t2=(S0+mj)|0;
      k=hh; hh=g; g=f; f=(e+t1)|0; e=c; c=b; b=a; a=(t1+t2)|0;
    }
    H[0]+=a; H[1]+=b; H[2]+=c; H[3]+=e; H[4]+=f; H[5]+=g; H[6]+=hh; H[7]+=k;
  });
  h.digest=function(){ this.pad(false); return Array.prototype.map.call(H,hex32be).join(""); };
  return h;
}

/* ---------- SHA-512 (64-bit words as hi/lo 32-bit pairs) ---------- */
var K512=[0x428a2f98,0xd728ae22,0x71374491,0x23ef65cd,0xb5c0fbcf,0xec4d3b2f,0xe9b5dba5,0x8189dbbc,0x3956c25b,0xf348b538,
0x59f111f1,0xb605d019,0x923f82a4,0xaf194f9b,0xab1c5ed5,0xda6d8118,0xd807aa98,0xa3030242,0x12835b01,0x45706fbe,
0x243185be,0x4ee4b28c,0x550c7dc3,0xd5ffb4e2,0x72be5d74,0xf27b896f,0x80deb1fe,0x3b1696b1,0x9bdc06a7,0x25c71235,

var $=function(id){return document.getElementById(id);};
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function pad2(n){ return String(n).padStart(2,"0"); }
function localStamp(d){
  var tz=-d.getTimezoneOffset(), sg=tz<0?"-":"+", ta=Math.abs(tz);
  return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate())+" "+pad2(d.getHours())+":"+pad2(d.getMinutes())+":"+pad2(d.getSeconds())+
    " (UTC"+sg+pad2(Math.floor(ta/60))+":"+pad2(ta%60)+")";
}
function human(b){
  if(b<1024) return b+" B";
  var u=["KB","MB","GB","TB"], i=-1; do{ b/=1024; i++; }while(b>=1024&&i<u.length-1);
  return b.toFixed(b<10?2:1)+" "+u[i];
}
function grouped(n){ return String(n).replace(/\B(?=(\d{3})+(?!\d))/g," "); }
function idxStr(i){ return String(i+1).padStart(items.length>99?3:2,"0"); }
function readChunk(blob){
  if(blob.arrayBuffer) return blob.arrayBuffer();
  return new Promise(function(res,rej){ var fr=new FileReader(); fr.onload=function(){res(fr.result);}; fr.onerror=function(){rej(fr.error);}; fr.readAsArrayBuffer(blob); });
}

   3. STATE + QUEUE
   ============================================================ */
var items=[], seen={}, gen=0, running=false, busyPdf=false;
var CHUNK=2*1048576;

function addFileList(list){
  list.sort(function(a,b){ return a.path<b.path?-1:a.path>b.path?1:0; });
  var added=0;
  list.forEach(function(e){
    var key=e.path+"|"+e.file.size+"|"+e.file.lastModified;
    if(seen[key]) return; seen[key]=true;
    items.push({file:e.file,path:e.path,size:e.file.size,mtime:e.file.lastModified,status:"wait",pct:0});
    added++;
  });
  if(added){ render(); pump(); }
}
async function pump(){
  if(running) return; running=true;
  var myGen=gen;
  while(true){
    if(myGen!==gen) break;
    var it=items.find(function(x){return x.status==="wait";});
    if(!it) break;
    await hashItem(it,myGen);
  }
  running=false;
  if(myGen!==gen){ pump(); return; }
  finishStatus();
}
async function hashItem(it,myGen){
  it.status="run"; it.start=new Date(); updateItem(it);
  var hs=[MD5(),SHA1(),SHA256(),SHA512()], off=0, lastPaint=0, t0=performance.now();
  try{
    while(off<it.size){
      if(myGen!==gen||items.indexOf(it)<0) return;
      var buf=new Uint8Array(await readChunk(it.file.slice(off,off+CHUNK)));
      if(!buf.length) throw new Error("short read");
      for(var k=0;k<4;k++) hs[k].update(buf);
      off+=buf.length;
      it.pct=off/it.size;
      var now=performance.now();
      if(now-lastPaint>120){ lastPaint=now; updateItem(it); progress(it, off/((now-t0)/1000)); await new Promise(function(r){setTimeout(r,0);}); }
    }
    if(off!==it.size) throw new Error("size changed");
    it.md5=hs[0].digest(); it.sha1=hs[1].digest(); it.sha256=hs[2].digest(); it.sha512=hs[3].digest();
    it.end=new Date(); it.status="done";
  }catch(e){ console.error(e); it.status="err"; it.end=new Date(); }
  markDuplicates(); updateItem(it); updateCount(); progress(null,0);
}
function markDuplicates(){
  var first={};
  items.forEach(function(it,i){
    it.dupOf=null;
    if(it.status!=="done") return;
    if(first[it.sha256]===undefined) first[it.sha256]=i; else it.dupOf=first[it.sha256];
  });
}

function applyLang(){
  document.documentElement.lang=LANG;
  var map={"t-sub":"sub","t-caseinfo":"caseinfo","t-examiner":"examiner","t-caseno":"caseno","t-files":"files",
    "t-addFiles":"addFiles","t-addFolder":"addFolder","t-hint":"hint","clear":"clear","empty":"empty","go":"go","t-foot":"foot"};
  for(var id in map) $(id).textContent=t(map[id]);
  document.title="Forensic Hash Calculator";
  render(); finishStatus();
}
function status(s){ $("status").textContent=s||""; }
function totals(){
  var tot=0,done=0,n=0,errs=0;
  items.forEach(function(it){ tot+=it.size; if(it.status==="done"||it.status==="err"){ done+=it.size; n++; } else if(it.status==="run") done+=it.size*it.pct; if(it.status==="err") errs++; });
  return {tot:tot,done:done,n:n,errs:errs};
}
function progress(it,speed){
  var s=totals();
  $("prog").style.width=(s.tot?Math.min(100,s.done/s.tot*100):0)+"%";
  if(it) status(t("working")+" "+(s.n+1)+"/"+items.length+" · "+Math.round(s.done/Math.max(1,s.tot)*100)+"% · "+(speed?human(speed)+"/s · ":"")+it.path);
}
function finishStatus(){
  var s=totals(), all=items.length&&s.n===items.length;
  if(!running&&all){
    status(t("ready")+" · "+items.length+" · "+human(s.tot)+(s.errs?" · "+s.errs+" "+t("errors"):""));
    setTimeout(function(){ if(!running) $("prog").style.width="0"; },600);
  } else if(!items.length){ status(""); $("prog").style.width="0"; }
  updateButtons();
}
function updateButtons(){
  var s=totals(), ok=items.length>0&&!running&&s.n===items.length&&s.errs<items.length;
  $("go").disabled=!ok||busyPdf; $("csv").disabled=!ok;
  $("addFiles").disabled=busyPdf; $("addFolder").disabled=busyPdf;
}
function updateCount(){
  var s=totals();
  $("cnt").textContent=String(items.length).padStart(2,"0")+"  "+t("unit")+(items.length?"  ·  "+human(s.tot):"");
  $("empty").hidden=items.length>0; $("clear").hidden=items.length===0;
  updateButtons();
}
function itemHTML(it,i){
  var h='<div class="idx">'+idxStr(i)+'</div><div style="min-width:0"><div class="fname">'+esc(it.path)+'</div>'+
    '<div class="fsize">'+human(it.size)+' · '+grouped(it.size)+' '+t("bytes")+'</div></div>';
  if(it.status==="done"){
    h+='<dl class="kv"><dt>MD5</dt><dd class="h">'+it.md5+'</dd><dt>SHA-1</dt><dd class="h">'+it.sha1+'</dd>'+
      '<dt>SHA-256</dt><dd class="h">'+it.sha256+'</dd><dt>SHA-512</dt><dd class="h">'+it.sha512+'</dd>'+
      '<dt>'+t("modified")+'</dt><dd>'+localStamp(new Date(it.mtime))+'</dd>'+
      '<dt>'+t("hashed")+'</dt><dd>'+localStamp(it.end)+'</dd></dl>';
  } else if(it.status==="err"){
    h+='<div class="kv"><span class="bad">'+t("err")+'</span></div>';
  } else if(it.status==="run"){
    h+='<div class="ibar"><i style="width:'+(it.pct*100).toFixed(1)+'%"></i></div>';
  } else {
    h+='<div class="kv"><span class="state">'+t("wait")+'</span></div>';
  }
  h+='<div class="actions">'+(it.dupOf!=null?'<span class="dup">'+t("dup")+' '+idxStr(it.dupOf)+'</span>':'')+
     (it.status!=="run"?'<button class="rm" type="button">'+t("remove")+'</button>':'')+'</div>';
  return h;
}
function bindItem(el,it){
  var rm=el.querySelector(".rm");
  if(rm) rm.addEventListener("click",function(){
    var i=items.indexOf(it); if(i<0) return;
    items.splice(i,1); delete seen[it.path+"|"+it.size+"|"+it.mtime];
    markDuplicates(); render(); finishStatus();
  });
}
function render(){
  var list=$("list"); list.innerHTML="";
  var frag=document.createDocumentFragment();
  items.forEach(function(it,i){
    var el=document.createElement("div"); el.className="item"; it.el=el;
    el.innerHTML=itemHTML(it,i); bindItem(el,it); frag.appendChild(el);
  });
  list.appendChild(frag); updateCount();
}
function updateItem(it){
  var i=items.indexOf(it); if(i<0||!it.el) return;
  if(it.status==="run"){ var bar=it.el.querySelector(".ibar i"); if(bar){ bar.style.width=(it.pct*100).toFixed(1)+"%"; return; } }
  it.el.innerHTML=itemHTML(it,i); bindItem(it.el,it);
  if(it.status==="done") items.forEach(function(o,j){ if(o!==it&&o.dupOf!=null&&o.el){ o.el.innerHTML=itemHTML(o,j); bindItem(o.el,o); } });
}

/* ---------- folder traversal (drag & drop) ---------- */
function readAllEntries(reader){
  return new Promise(function(res){
    var all=[];
    (function next(){ reader.readEntries(function(batch){ if(!batch.length) res(all); else { all=all.concat(batch); next(); } }, function(){ res(all); }); })();
  });
}
async function walk(entry,out){
  if(entry.isFile){
    await new Promise(function(res){ entry.file(function(f){ out.push({file:f,path:entry.fullPath.replace(/^\//,"")}); res(); }, function(){ res(); }); });
  } else if(entry.isDirectory){
    var children=await readAllEntries(entry.createReader());
    for(var i=0;i<children.length;i++) await walk(children[i],out);
  }
}
async function handleDrop(dt){
  var out=[], entries=[];
  if(dt.items&&dt.items.length&&dt.items[0].webkitGetAsEntry){
    for(var i=0;i<dt.items.length;i++){ var en=dt.items[i].webkitGetAsEntry&&dt.items[i].webkitGetAsEntry(); if(en) entries.push(en); }
  }
  if(entries.length){ for(var j=0;j<entries.length;j++) await walk(entries[j],out); }
  else { [].forEach.call(dt.files,function(f){ out.push({file:f,path:f.name}); }); }
  addFileList(out);
}

/* ============================================================
   5. CSV  (headers in English + ISO-style stamps: stable, tool-friendly)
   ============================================================ */
function csvText(meta){
  var q=function(s){ s=String(s==null?"":s); return /[",\r\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; };
  var rows=[["No","Case number","Examiner","Path","Size (bytes)","Last modified","Hashed at","MD5","SHA-1","SHA-256","SHA-512","Duplicate of"].join(",")];
  items.forEach(function(it,i){
    rows.push([idxStr(i),meta.caseno,meta.examiner,it.path,it.size,localStamp(new Date(it.mtime)),
      it.status==="done"?localStamp(it.end):"ERROR: unreadable",
      it.md5||"",it.sha1||"",it.sha256||"",it.sha512||"",it.dupOf!=null?idxStr(it.dupOf):""].map(q).join(","));
  });
  return "\uFEFF"+rows.join("\r\n")+"\r\n";
}
function csvBytes(meta){ return new TextEncoder().encode(csvText(meta)); }
function sha256Hex(bytes){ return SHA256().update(bytes).digest(); }

/* ============================================================
   6. MINIMAL PDF WRITER (A4, Helvetica + Courier, as Photographic Report)
   ============================================================ */
var HW=[278,278,355,556,556,889,667,191,333,333,389,584,278,333,278,278,556,556,556,556,556,556,556,556,556,556,278,278,584,584,584,556,1015,667,667,722,722,667,611,778,722,278,500,667,556,833,722,778,667,778,722,667,611,722,667,944,667,667,611,278,278,278,469,556,333,556,556,500,556,556,278,556,556,222,222,500,222,833,556,556,556,556,333,500,278,556,500,722,500,500,500,334,260,334,584];
function textWidth(s,size,font){
  if(font==="mono") return s.length*0.6*size;
  var w=0; for(var i=0;i<s.length;i++){ var c=s.charCodeAt(i); w+=(c>=32&&c<=126)?HW[c-32]:556; }
  return w/1000*size*(font==="bold"?1.07:1);
}
var WINANSI={0x2013:0x96,0x2014:0x97,0x2018:0x91,0x2019:0x92,0x201C:0x93,0x201D:0x94,0x2022:0x95,0x2026:0x85,0x20AC:0x80,0x2122:0x99,0x0152:0x8C,0x0153:0x9C};
function pdfEsc(s){
  var o="(";
  for(var ch of String(s)){
    var c=ch.codePointAt(0); if(c>255) c=WINANSI[c]||63;
    if(c===40||c===41||c===92) o+="\\"+String.fromCharCode(c);
    else if(c<32||c>126) o+="\\"+c.toString(8).padStart(3,"0");
    else o+=String.fromCharCode(c);
  }
  return o+")";
}
var PW=595.28, PH=841.89, MG=45;
function PdfPage(){ this.ops=[]; }
PdfPage.prototype.text=function(x,y,size,str,o){
  o=o||{}; if(str===""||str==null) return;
  var g=(o.gray==null?0.08:o.gray).toFixed(3), f=o.font==="bold"?"F2":o.font==="mono"?"F3":"F1";
  this.ops.push("BT "+g+" "+g+" "+g+" rg /"+f+" "+size+" Tf "+x.toFixed(2)+" "+y.toFixed(2)+" Td "+pdfEsc(str)+" Tj ET");
};
PdfPage.prototype.textRight=function(x,y,size,str,o){ this.text(x-textWidth(String(str),size,o&&o.font),y,size,str,o); };
PdfPage.prototype.line=function(x1,y1,x2,y2,gray,w){
  gray=gray==null?0.78:gray; w=w||0.6;
  this.ops.push(gray+" "+gray+" "+gray+" RG "+w+" w "+x1.toFixed(2)+" "+y1.toFixed(2)+" m "+x2.toFixed(2)+" "+y2.toFixed(2)+" l S");
};
function bytesOf(str){ var a=new Uint8Array(str.length); for(var i=0;i<str.length;i++) a[i]=str.charCodeAt(i)&0xFF; return a; }
function buildPdf(pages){
  var chunks=[], len=0, offsets=[0], n=5;
  var push=function(d){ var b=typeof d==="string"?bytesOf(d):d; chunks.push(b); len+=b.length; };
  var plan=pages.map(function(p){ return {page:p,contentNum:++n,pageNum:++n}; });
  var write=function(num,parts){ offsets[num]=len; push(num+" 0 obj\n"); parts.forEach(push); push("\nendobj\n"); };
  push("%PDF-1.4\n%\xE2\xE3\xCF\xD3\n");
  write(1,["<< /Type /Catalog /Pages 2 0 R >>"]);
  write(2,["<< /Type /Pages /Count "+plan.length+" /Kids ["+plan.map(function(p){return p.pageNum+" 0 R";}).join(" ")+"] >>"]);
  write(3,["<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>"]);
  write(4,["<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>"]);
  write(5,["<< /Type /Font /Subtype /Type1 /BaseFont /Courier /Encoding /WinAnsiEncoding >>"]);
  plan.forEach(function(p){
    var cs=p.page.ops.join("\n");
    write(p.contentNum,["<< /Length "+cs.length+" >>\nstream\n"+cs+"\nendstream"]);
    write(p.pageNum,["<< /Type /Page /Parent 2 0 R /MediaBox [0 0 "+PW+" "+PH+"] /Resources << /Font << /F1 3 0 R /F2 4 0 R /F3 5 0 R >> >> /Contents "+p.contentNum+" 0 R >>"]);
  });
  var xref=len, x="xref\n0 "+(n+1)+"\n0000000000 65535 f \n";
  for(var i=1;i<=n;i++) x+=String(offsets[i]||0).padStart(10,"0")+" 00000 n \n";
  push(x); push("trailer\n<< /Size "+(n+1)+" /Root 1 0 R >>\nstartxref\n"+xref+"\n%%EOF\n");
  var out=new Uint8Array(len), o=0; chunks.forEach(function(c){ out.set(c,o); o+=c.length; });
  return out;
}
function wrap(str,size,width,font){
  var lines=[], line="";
  // break on separators first, hard-break anything still too long
  var tokens=String(str).split(/(?<=[\/\\ _\-.])/);
  tokens.forEach(function(tok){
    if(textWidth(line+tok,size,font)<=width){ line+=tok; return; }
    if(line) lines.push(line);
    line="";
    while(textWidth(tok,size,font)>width){
      var k=tok.length; while(k>1&&textWidth(tok.slice(0,k),size,font)>width) k--;
      lines.push(tok.slice(0,k)); tok=tok.slice(k);
    }
    line=tok;
  });
  if(line) lines.push(line);
  return lines.length?lines:[""];
}

/* ============================================================
   7. REPORT COMPOSITION
   ============================================================ */
var TOP=PH-62, BOTTOM=56, LBL=MG+26, VAL=MG+96;
function chrome(p,meta,no,total){
  p.text(MG,PH-40,8,meta.caseno?t("caseno")+": "+meta.caseno:"",{gray:0.42});
  p.textRight(PW-MG,PH-40,8,meta.examiner?t("examiner")+": "+meta.examiner:"",{gray:0.42});
  p.line(MG,PH-48,PW-MG,PH-48);
  p.line(MG,40,PW-MG,40);
  p.text(MG,29,8,t("generated")+" "+meta.stamp,{gray:0.42});
  p.textRight(PW-MG,29,8,t("page")+" "+no+" / "+total,{gray:0.42});
}
function coverPage(meta){
  var p=new PdfPage(), s=totals();
  var starts=items.filter(function(i){return i.start;}).map(function(i){return i.start.getTime();});
  var ends=items.filter(function(i){return i.end;}).map(function(i){return i.end.getTime();});
  p.line(MG,PH-110,PW-MG,PH-110,0.15,1.4);
  p.text(MG,PH-138,10,t("exhibit").toUpperCase(),{gray:0.45});
  p.text(MG,PH-172,24,t("report"),{font:"bold",gray:0.06});
  var rows=[[t("caseno"),meta.caseno||"—"],[t("examiner"),meta.examiner||"—"],
    [t("total"),String(items.length)+(s.errs?"  ("+s.errs+" "+t("errors")+")":"")],
    [t("totalSize"),human(s.tot)+"  ·  "+grouped(s.tot)+" "+t("bytes")],
    [t("period"),localStamp(new Date(Math.min.apply(null,starts)))+"  \u2014  "+localStamp(new Date(Math.max.apply(null,ends))).replace(/ \(UTC.*\)$/,"")],
    [t("algos"),"MD5  ·  SHA-1  ·  SHA-256  ·  SHA-512"],[t("tool"),t("toolv")],[t("generated"),meta.stamp]];
  var y=PH-224;
  rows.forEach(function(r){
    p.text(MG,y,8,r[0].toUpperCase(),{gray:0.45});
    p.text(MG,y-14,11.5,r[1],{font:"bold",gray:0.06});
    p.line(MG,y-22,PW-MG,y-22,0.85);
    y-=37;
  });
  y-=14;
  p.text(MG,y,8,"MD5 / SHA",{gray:0.45}); y-=14;
  wrap(t("note"),8.5,PW-2*MG).forEach(function(l){ p.text(MG,y,8.5,l,{gray:0.3}); y-=11.5; });
  y-=12;
  p.text(MG,y,8,t("csvHash").toUpperCase(),{gray:0.45});
  p.text(MG,y-14,8.6,meta.csvSha,{font:"mono",gray:0.06});
  p.text(MG,y-26,7.5,meta.csvName,{gray:0.45});
  // signature block
  var sy=Math.min(y-70,150), cw=(PW-2*MG-30)/3;
  [t("nameRole"),t("signature"),t("date")].forEach(function(lb,k){
    var x=MG+k*(cw+15);
    p.line(x,sy,x+cw,sy,0.35,0.6);
    p.text(x,sy-11,7.5,lb.toUpperCase(),{gray:0.45});
  });
  return p;
}
function entryRows(it){
  var r=[[t("size").toUpperCase(),grouped(it.size)+" "+t("bytes")+"  ("+human(it.size)+")",false],
         [t("modified").toUpperCase(),localStamp(new Date(it.mtime)),false]];
  if(it.status!=="done"){ r.push(["",t("err"),false]); return r; }
  r.push([t("hashed").toUpperCase(),localStamp(it.end),false]);
  r.push(["MD5",it.md5,true],["SHA-1",it.sha1,true],["SHA-256",it.sha256,true],
         ["SHA-512",it.sha512.slice(0,64),true],["",it.sha512.slice(64),true]);
  if(it.dupOf!=null) r.push(["",t("dup")+" "+idxStr(it.dupOf),false]);
  return r;
}
function composeEntries(){
  var pages=[], p=null, y=0, RH=10.6;
  function newPage(){
    p=new PdfPage(); pages.push(p); y=TOP-14;
    p.text(MG,y,8,t("files2").toUpperCase(),{gray:0.45}); y-=18;
  }
  newPage();
  items.forEach(function(it,i){
    var pathLines=wrap(it.path,9,PW-MG-LBL,"bold"), rows=entryRows(it);
    var h=pathLines.length*11.5+rows.length*RH+14;
    if(y-h<BOTTOM) newPage();
    p.text(MG,y,9,idxStr(i),{font:"bold",gray:0.06});
    pathLines.forEach(function(l){ p.text(LBL,y,9,l,{font:"bold",gray:0.08}); y-=11.5; });
    y-=1.5;
    rows.forEach(function(r){
      if(r[0]) p.text(LBL,y,6.8,r[0],{gray:0.5});
      var isErr=!r[2]&&(r[1]===t("err")||r[1].indexOf(t("dup"))===0);
      p.text(VAL,y,r[2]?8:8,r[1],{font:r[2]?"mono":(isErr?"bold":undefined),gray:isErr?0.25:0.12});
      y-=RH;
    });
    y-=2; p.line(MG,y+4,PW-MG,y+4,0.86,0.5); y-=10;
  });
  return pages;
}
function baseName(meta){
  return (meta.caseno||"Hashes").replace(/[^\w\-À-ÿ ]+/g,"_").trim().replace(/\s+/g,"-")+"_hashes_"+new Date().toISOString().slice(0,10);
}
function meta(){
  return {examiner:$("examiner").value.trim(),caseno:$("caseno").value.trim(),stamp:localStamp(new Date())};
}
function download(bytes,type,name){
  var url=URL.createObjectURL(new Blob([bytes],{type:type})), a=document.createElement("a");
  a.href=url; a.download=name; a.rel="noopener"; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); },60000);
}
function exportCSV(){
  var m=meta(), name=baseName(m)+".csv", b=csvBytes(m);
  download(b,"text/csv;charset=utf-8",name);
  status(t("csvSaved")+" · "+name+" · SHA-256 "+sha256Hex(b).slice(0,16)+"…");
}
async function generatePdf(){
  if(busyPdf) return; busyPdf=true; updateButtons();
  try{
    var m=meta(); m.csvName=baseName(m)+".csv"; m.csvSha=sha256Hex(csvBytes(m));
    status(t("building")+"…"); await new Promise(function(r){setTimeout(r,0);});
    var pages=[coverPage(m)].concat(composeEntries());
    pages.forEach(function(p,i){ chrome(p,m,i+1,pages.length); });
    var name=baseName(m)+".pdf";
    download(buildPdf(pages),"application/pdf",name);
    status(t("pdfSaved")+" · "+name);
  }catch(e){ console.error(e); status("Error"); }
  busyPdf=false; updateButtons();
}

$("dirIn").addEventListener("change",function(e){ var l=[].map.call(e.target.files,function(f){return {file:f,path:f.webkitRelativePath||f.name};}); e.target.value=""; addFileList(l); });
var dragDepth=0;
document.addEventListener("dragenter",function(e){ e.preventDefault(); dragDepth++; $("addFiles").classList.add("drag"); $("addFolder").classList.add("drag"); });
